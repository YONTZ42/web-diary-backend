name: deploy-app-runner

on:
  push:
    branches: [develop] #production環境でmainブランチ
    paths:
      - ".github/workflows/cdk-deploy-app-runner.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      STAGE: ${{ vars.STAGE }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apprunner-cdk

      - uses: actions/setup-node@v4
        with:
          node-version: "20"



      - name: Install infra dependencies
        working-directory: ./aws-infra
        run: npm ci

      - name: Deploy ECR stack
        working-directory: ./aws-infra
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          npx cdk deploy ${PROJECT_NAME}-${STAGE}-ecr \
            --app "npx ts-node bin/aws-ecr.ts" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Read Django ECR output
        working-directory: ./aws-infra
        run: |
          echo "DJANGO_REPO_URI=$(jq -r 'to_entries[0].value.DjangoRepoUri' cdk-outputs.json)" >> $GITHUB_ENV


      - uses: aws-actions/amazon-ecr-login@v2




      - name: Build and push Django image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${DJANGO_REPO_URI}:${IMAGE_TAG} ./DjangoAPI
          docker tag ${DJANGO_REPO_URI}:${IMAGE_TAG} ${DJANGO_REPO_URI}:latest
          docker push ${DJANGO_REPO_URI}:${IMAGE_TAG}
          docker push ${DJANGO_REPO_URI}:latest


      - name: Deploy AppRunner stack
        working-directory: ./aws-infra
        env:
          STAGE: ${{ vars.STAGE }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

          DJANGO_IMAGE_TAG: ${{ github.sha }}
          LAMBDA_YOLO_IMAGE_TAG: latest
          LAMBDA_BG_IMAGE_TAG: latest

          APP_ENV: ${{ env.STAGE }}
          DEBUG: ${{ github.ref_name == 'main' && 'False' || 'True' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}

          GIT_SHA: ${{ github.sha }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          HOSTED_ZONE_DOMAIN: ${{ secrets.HOSTED_ZONE_DOMAIN }}

          CLOUDFRONT_PUBLIC_KEY_ID: ${{ secrets.CLOUDFRONT_PUBLIC_KEY_ID }}

          CREATE_SUPERUSER: ${{ secrets.CREATE_SUPERUSER }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}

          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

        run: |
          npx cdk deploy \
            ${PROJECT_NAME}-${STAGE}-storage \
            ${PROJECT_NAME}-${STAGE}-apprunner \
            ${PROJECT_NAME}-${STAGE}-monitoring \
            ${PROJECT_NAME}-${STAGE}-alerting \
            --app "npx ts-node bin/aws-app.ts" \
            --require-approval never