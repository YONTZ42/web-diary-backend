name: deploy-observability

on:
  push:
    branches: [develop] # production環境では main
    paths:
      - "aws-infra/bin/aws-app.ts"
      - "aws-infra/lib/monitoring-stack.ts"
      - "aws-infra/lib/alerting-stack.ts"
      - ".github/workflows/cdk-deploy-observability.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      STAGE: ${{ vars.STAGE }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-observability-cdk

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install infra dependencies
        working-directory: ./aws-infra
        run: npm ci

      - name: CDK synth
        working-directory: ./aws-infra
        env:
          STAGE: ${{ vars.STAGE }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

          RUNBOOK_BASE_URL: ${{ vars.RUNBOOK_BASE_URL }}
        run: |
          npx cdk synth \
            ${PROJECT_NAME}-${STAGE}-monitoring \
            ${PROJECT_NAME}-${STAGE}-alerting \
            --app "npx ts-node bin/aws-app.ts"

      - name: Deploy Monitoring and Alerting stacks
        working-directory: ./aws-infra
        env:
          STAGE: ${{ vars.STAGE }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

          RUNBOOK_BASE_URL: ${{ vars.RUNBOOK_BASE_URL }}
        run: |
          npx cdk deploy \
            ${PROJECT_NAME}-${STAGE}-monitoring \
            ${PROJECT_NAME}-${STAGE}-alerting \
            --app "npx ts-node bin/aws-app.ts" \
            --require-approval never
            