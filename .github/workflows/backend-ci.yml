name: backend-ci


on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./DjangoAPI
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, api, smoke]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: museum_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d museum_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-secret-key
      DEBUG: '0'
      APP_ENV: ci
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_REGION: ap-northeast-1
      AWS_STORAGE_BUCKET_NAME: test-bucket
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/museum_test
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            DjangoAPI/requirements.txt
            pyproject.toml
            poetry.lock
            uv.lock

      - name: Install OS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install \
              pytest \
              pytest-django \
              pytest-mock \
              factory-boy \
              moto[s3] \
              coverage
          fi

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import socket
          import time

          host = '127.0.0.1'
          port = 5432
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print('postgres is ready')
                      break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit('postgres did not become ready in time')
          PY

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run pytest (${{ matrix.suite }})
        shell: bash
        run: |
          mkdir -p test-results
          pytest -q tests/${{ matrix.suite }} --junitxml=test-results/${{ matrix.suite }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ matrix.suite }}
          path: DjangoAPI/test-results/${{ matrix.suite }}.xml
          if-no-files-found: warn


