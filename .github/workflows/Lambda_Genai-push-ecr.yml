name: genai-image-build

on:
  push:
    branches: ["main"]
    paths:
      - "Lambda_Genai/**"
      - ".github/workflows/Lambda_Genai-push-ecr.yml"
  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:
  AWS_REGION: ap-northeast-1
  ECR_REPO: web-diary/generate-photo/genai
  LAMBDA_FUNCTION_NAME: generate_backfround_image_genai # AWS上のLambda関数名に書き換えてください

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Lambda_Genai

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # マルチステージビルドにより、この1ステップで軽量なイメージを作成
      - name: Build & Push GenAI image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ./Lambda_Genai
          file: ./Lambda_Genai/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lambda関数のコード（イメージ）を更新
      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest