name: deploy-lambda-bg

on:
  push:
    branches: [main, develop]
    paths:
      - "LambdaContainers/Lambda_Genai/**"
      - "aws-infra/bin/aws-ecr.ts"
      - "aws-infra/bin/aws-app.ts"
      - "aws-infra/lib/ecr-stack.ts"
      - "aws-infra/lib/lambda-bg-stack.ts"
      - "aws-infra/lib/storage-stack.ts"
      - ".github/workflows/deploy-lambda-bg.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      STAGE: ${{ github.ref_name == 'main' && 'production' || 'staging'}}
      AWS_REGION: ${{ vars.AWS_REGION}}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install infra dependencies
        working-directory: ./aws-infra
        run: npm ci

      - name: Deploy ECR stack
        working-directory: ./aws-infra
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          npx cdk deploy ${PROJECT_NAME}-${STAGE}-ecr \
            --app "npx ts-node bin/aws-ecr.ts" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Read BG ECR output
        working-directory: ./aws-infra
        run: |
          echo "BG_REPO_URI=$(jq -r 'to_entries[0].value.LambdaBgRepoUri' cdk-outputs.json)" >> $GITHUB_ENV

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push BG image
        uses: docker/build-push-action@v6
        with:
          context: ./LambdaContainers/Lambda_Genai
          file: ./LambdaContainers/Lambda_Genai/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.BG_REPO_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Lambda BG stack
        working-directory: ./aws-infra
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

          LAMBDA_BG_IMAGE_TAG: ${{ github.sha }}

          APP_ENV: ${{ env.STAGE }}
          DEBUG: ${{ github.ref_name == 'main' && 'false' || 'true' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}

          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          HOSTED_ZONE_DOMAIN: ${{ secrets.HOSTED_ZONE_DOMAIN }}

          CLOUDFRONT_PUBLIC_KEY_ID: ${{ secrets.CLOUDFRONT_PUBLIC_KEY_ID }}
          CLOUDFRONT_PRIVATE_KEY: ${{ secrets.CLOUDFRONT_PRIVATE_KEY }}

        run: |
          npx cdk deploy \
            ${PROJECT_NAME}-${STAGE}-storage \
            ${PROJECT_NAME}-${STAGE}-lambda-bg \
            --app "npx ts-node bin/aws-app.ts" \
            --require-approval never