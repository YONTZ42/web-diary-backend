name: crop-yolo_multi-build-optimized

on:
  push:
    branches: ["main"]
    paths:
      - "Lambda_CropYOLO_Multi/**"
      - ".github/workflows/Lambda_CropYOLO_Multi-push-ecr.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPO: web-diary/crop-yolo-lambda/multi # 1つのリポジトリに統合
  LAMBDA_FUNCTION_NAME: HelloYOLO

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Lambda_CropYOLO_Multi

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # モデルファイルのダウンロード (キャッシュなしでも動作するが、Dockerfile外で管理)
      - name: Download YOLO Models
        run: |
          mkdir -p models
          [ -f models/yolo26n-seg.pt ] || curl -L -o models/yolo26n-seg.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n-seg.pt
          [ -f models/yolo26s-seg.pt ] || curl -L -o models/yolo26s-seg.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26s-seg.pt

      # ---- Build & Push (マルチステージを1つのステップで処理) ----
      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./Lambda_CropYOLO_Multi
          file: ./Lambda_CropYOLO_Multi/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          # ★GitHub Actions専用の高速キャッシュを利用
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Lambda関数の更新 ----
      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest